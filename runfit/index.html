<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RunFit Pro</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #dbe3f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 180px);
      color: var(--text);
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 44px);
      line-height: 1.12;
    }

    p {
      margin: 0;
      line-height: 1.75;
      color: var(--muted);
      font-size: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .item h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .item p { font-size: 15px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="badge">iOS App</div>
      <h1>RunFit Pro</h1>
      <p>RunFit Pro 帮助跑步者在跑前热身、跑后拉伸。跟随动作视频和计时引导完成训练，也可以按自己的距离和动作整理训练方案。</p>
      <div class="actions">
        <a class="btn" href="https://apps.apple.com/app/id6751308244">在 App Store 查看</a>
      </div>
    </section>

    <section class="grid" aria-label="features">
      <article class="item">
        <h2>跑前跑后</h2>
        <p>按跑步距离完成热身和拉伸，动作有视频和倒计时。</p>
      </article>
      <article class="item">
        <h2>自己的方案</h2>
        <p>可以调整动作顺序和每节时长，整理成自己的训练。</p>
      </article>
      <article class="item">
        <h2>自己的视频</h2>
        <p>可以从相册加入自己的动作视频，跟着练习。</p>
      </article>
    </section>
  </main>
</body>
</html>
